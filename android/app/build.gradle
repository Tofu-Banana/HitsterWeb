plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hitsterweb.host'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hitsterweb.host'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so you can install it without setting up a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
